# nginx vhost for MinIO's S3 API.
#
# Every directive below is here for a reason — the commented ones are the four
# that actually break uploads or make them slow. Adapt the certificate paths to
# whatever your existing setup uses.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name s3.example.com;   # <-- your S3 domain

    ssl_certificate     /etc/letsencrypt/live/s3.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.example.com/privkey.pem;

    # Cheap latency win: resume TLS instead of a full handshake on every one of
    # the small API calls the app makes.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # 1. No cap. The default 1m would reject any scan over a megabyte with a 413.
    client_max_body_size 0;

    # 2. Stream the upload straight to MinIO. Left on (the default), nginx
    #    writes the entire body to a temp file first, then forwards it — which
    #    doubles the disk I/O and makes the client wait for both hops.
    proxy_request_buffering off;

    # 3. Same in the other direction, so downloads start immediately.
    proxy_buffering off;

    # 4. SigV4 signs the Host header. nginx's default is to replace it with the
    #    upstream address, which makes every presigned URL fail with
    #    SignatureDoesNotMatch. This line is the single most common mistake.
    proxy_set_header Host $http_host;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep the upstream connection alive between the app's many small calls.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Big files on a phone connection need generous timeouts.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    chunked_transfer_encoding off;

    # Deliberately NOT setting any Access-Control-* header here. MinIO already
    # sends them (see MINIO_API_CORS_ALLOW_ORIGIN); duplicates are a hard error
    # in the browser and produce a confusing opaque CORS failure.

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}

# The admin console, on its own name so the S3 API host stays clean.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name console.example.com;   # <-- your console domain

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The console uses websockets for live stats.
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
